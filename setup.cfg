[metadata]
name = record2mcap
version = 0.2.0
description = Convert Apollo Cyber Record files to self-contained Foxglove MCAP files
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
include_package_data = True
python_requires = >=3.9
install_requires =
    foxglove-schemas-protobuf==0.3.0
    lz4==4.4.5
    mcap==1.4.0
    mcap-protobuf-support==0.5.4
    Pillow==11.3.0
    protobuf==6.33.6
    zstandard==0.25.0

[options.packages.find]
include = record2mcap*

[options.entry_points]
console_scripts =
    record2mcap = record2mcap.__main__:main
    perfboard = record2mcap.perfboard_server:cli_main

[options.package_data]
record2mcap =
    perfboard_static/*.html
    perfboard_static/*.css
    perfboard_static/*.js
